# What ENCORE. OS is built from, named once, here. Each is a published release.
#
#   name  repository  release  file  sha256
#
# The image build downloads each file from that release and checks its SHA-256 before using
# it. CI (.github/pins/check.sh) checks that each release is published, that the file is
# attached to it, and that the SHA-256 is the one the release itself published. For pi-gen
# (Raspberry Pi's own image builder) the release is Raspberry Pi OS's tag, and the last
# column is the commit that tag points to.
#
# To move one: change its line, update the README's Pinned releases table to match
# (check.sh --table prints it), and open "Use <repository> vX.Y.Z (was vA.B.C)".

