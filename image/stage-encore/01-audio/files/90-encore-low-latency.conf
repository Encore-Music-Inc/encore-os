# ENCORE. for Raspberry Pi: low-latency PipeWire defaults for music.
# 256 samples at 48 kHz is about 5 ms per buffer: quick enough to play and
# sing through, with room to spare on a Pi 4 or 5. Apps can still ask for
# bigger buffers (a Pi 3 may need 512), and 44.1 kHz works too.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 ]
    default.clock.quantum       = 256
    default.clock.min-quantum   = 64
    default.clock.max-quantum   = 2048
}
