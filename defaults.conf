# ENCORE. OS defaults
#
# This is the one file that decides what ENCORE. OS is: its version, the apps it comes
# with, what's on the Home screen, how it looks and what the welcome shows. Change it,
# rebuild, done. ([os] version is the release version: the one place it lives.)
# On a running system it lives at /etc/encore-os/defaults.conf (the Home screen and the
# welcome read it from there), so tiles can be changed without rebuilding anything.
#
# Lines starting with # are notes. Blank lines don't matter.

[os]
name = ENCORE. OS
version = 1.0.0
codename = Soundcheck
hostname = encore
# password: the ENCORE. login screen every time. automatic: straight to the desktop.
login = password

[look]
# dark everywhere, in the ENCORE. colours (encore-tokens.css)
background = #0c0a09
surface = #171412
text = #f2efe8
accent = #ff3b00
font = DM Sans 11
mono_font = Space Mono 10
wallpaper = encore-dark
# the boot animation: encore (the E. builds itself) or pix (Raspberry Pi's own)
boot_animation = encore

[apps]
# Installed with ENCORE. OS, and kept installed by its updates. Debian package names.
# Music
vlc
hydrogen
# Everyday
chromium
rpi-chromium-mods
libreoffice-writer
libreoffice-calc
libreoffice-impress
libreoffice-gtk3
pcmanfm-pi
# Under the hood (Home, Welcome)
python3-gi
gir1.2-gtk-3.0
gir1.2-gst-plugins-base-1.0
gstreamer1.0-gtk3
gstreamer1.0-plugins-good
gstreamer1.0-libav
pulseaudio-utils
librsvg2-common

[remove]
# Things Raspberry Pi OS ships that ENCORE. OS leaves out. Debian package names.
# (none yet)

[home]
# The Home screen, top to bottom. "## Title" starts a row; each line under it is an app
# (its .desktop file name; list a few, separated by commas, and the first one installed is used), optionally "| Label" to rename the tile. Apps that aren't
# installed are skipped, so it's safe to list extras.
## Make music
encore-basement-studio.desktop | Basement Studio
encore-music.desktop | ENCORE.
org.hydrogenmusic.Hydrogen.desktop, hydrogen.desktop | Hydrogen
## Everyday
chromium.desktop, chromium-browser.desktop | Browser
pcmanfm.desktop | Files
libreoffice-writer.desktop | Writer
libreoffice-calc.desktop | Sheets
vlc.desktop | VLC
rpcc.desktop | Settings

[welcome]
# The first time someone logs in. The video plays first (Skip is always there).
video = /usr/share/encore-os/welcome.mp4
# The ENCORE. page (encoremusic.studio); leave empty to skip that step
music_url = https://encoremusic.studio
help_url = https://github.com/Encore-Music-Inc/encore-os#readme
